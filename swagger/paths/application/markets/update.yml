tags:
  - Markets
operationId: update-a-market
summary: Update a market
security:
  - userBearerAuth: []
  - userApiKey: []
description: Rename, reorder or restore a market. Only administrators can update markets.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/market_create_update_payload'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/market'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: The market does not exist in the account
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
