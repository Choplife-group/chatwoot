tags:
  - Markets
operationId: delete-a-market
summary: Archive a market
security:
  - userBearerAuth: []
  - userApiKey: []
description: Archive a market. Markets are not deleted, so existing conversations and reports keep their market. Only administrators can archive markets.
responses:
  '200':
    description: Success
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: The market does not exist in the account
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
