tags:
  - Conversation Categories
operationId: reorder-conversation-categories
summary: Reorder conversation categories
security:
  - userBearerAuth: []
  - userApiKey: []
description: Set the order of sibling categories. Pass their IDs in the new order; they must share the same parent. Only administrators can reorder categories.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [ids]
        properties:
          ids:
            type: array
            items:
              type: number
            description: Sibling category IDs in their new order
            example: [3, 1, 2]
responses:
  '200':
    description: Success
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
