tags:
  - Conversations
operationId: update-conversation-vip
summary: Update the VIP flag
description: Marks a conversation as VIP or removes the mark. Only team leads of the conversation's team and administrators can do this.
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - vip
        properties:
          vip:
            type: boolean
            description: Whether the conversation is VIP
            example: true
responses:
  '200':
    description: Success
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: vip is not true or false
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
