type: object
properties:
  id:
    type: number
    description: The ID of the market
  name:
    type: string
    description: The name of the market, e.g. Uganda
  code:
    type: string
    description: Two-letter ISO country code of the market, e.g. UG
  position:
    type: number
    description: Sort order; lower numbers are listed first
  archived:
    type: boolean
    description: Archived markets stay on existing conversations but can't be chosen any more
