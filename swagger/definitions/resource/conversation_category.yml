type: object
properties:
  id:
    type: number
    description: The ID of the category
  name:
    type: string
    description: The name of the category, e.g. Pending approval
  parent_id:
    type:
      - number
      - 'null'
    description: The ID of the parent category; null for a top-level category
  depth:
    type: number
    description: Level in the tree, from 1 (top level) to 5
  ancestor_ids:
    type: array
    items:
      type: number
    description: IDs of the parent categories, top level first
  position:
    type: number
    description: Order among sibling categories
  archived:
    type: boolean
    description: Archived categories stay on existing conversations but can't be chosen any more
